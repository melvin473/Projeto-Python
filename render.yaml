services:
  - type: web
    name: Plataforma-Preditiva-v1
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn seu_projeto_raiz.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0